name: CI
on:
  push: null
  pull_request: null
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: 'package-lock.json

          frontend/package-lock.json

          '
    - run: npm install --global npm@11.11.0 --ignore-scripts
    - run: npm ci --ignore-scripts
      working-directory: .
    - run: npm ci --ignore-scripts
    - name: Fail on stray console statements in shipped source
      run: node scripts/ci/no-console.mjs
      working-directory: .
    - run: npm run type-check
    - run: npm test
    - run: npm run build
  prover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prover
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm install --no-audit --no-fund
    - run: npm run check
    - run: npm test
  circuit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm install --global npm@11.11.0 --ignore-scripts
    - run: npm ci --ignore-scripts
    - run: npm run test:circuit
