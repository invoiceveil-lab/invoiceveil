name: CI
on:
  push: null
  pull_request: null
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: 'package-lock.json

          frontend/package-lock.json

          '
    - run: npm install --global npm@11.11.0 --ignore-scripts
    - run: npm ci --ignore-scripts
      working-directory: .
    - run: npm ci --ignore-scripts
    - name: Fail on stray console statements in shipped source
      run: node scripts/ci/no-console.mjs
      working-directory: .
    - run: npm run type-check
    - run: npm test
    - run: npm run build
  prover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prover
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm install --no-audit --no-fund
    - run: npm run check
    - run: npm test
  circuit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm install --global npm@11.11.0 --ignore-scripts
    - run: npm ci --ignore-scripts
    - run: npm run test:circuit
  artifacts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check proved-artifact size budget
      run: 'node scripts/ci/artifact-budget.mjs | tee -a "$GITHUB_STEP_SUMMARY"

        '
  lockfile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm install --global npm@11.11.0 --ignore-scripts
    - name: npm ci (root)
      run: npm ci --ignore-scripts
    - name: npm ci (frontend)
      run: npm ci --ignore-scripts --prefix frontend
    - name: npm ci (prover)
      run: npm ci --ignore-scripts --prefix prover
    - uses: dtolnay/rust-toolchain@stable
    - name: Cargo lockfile check
      run: cargo metadata --locked --format-version 1 > /dev/null
      working-directory: contract
  env-consistency:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check .env.example against code
      run: node scripts/ci/env-consistency.mjs
